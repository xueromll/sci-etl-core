name: Downstream

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-downstream-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CLI_REPOSITORY: xueromll/sci-etl-cli
  CATALOGUE_REPOSITORY: xueromll/udg-catalogue

jobs:
  cli:
    name: sci-etl-cli against this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out sci-etl-cli
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.CLI_REPOSITORY }}
          path: .sci-etl-cli

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .sci-etl-cli/pyproject.toml

      - name: Install this commit with the CLI's extras, then the CLI without replacing sci-etl-core
        shell: python
        run: |
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path(".sci-etl-cli/pyproject.toml").read_text(encoding="utf-8"))["project"]
          requirements = [*project["dependencies"], *project["optional-dependencies"]["dev"]]
          core = next(requirement for requirement in requirements if requirement.startswith("sci-etl-core"))
          extras = re.fullmatch(r"sci-etl-core\[([^\]]*)\].*", core).group(1).replace(" ", "")
          others = [requirement for requirement in requirements if not requirement.startswith("sci-etl-core")]
          pip = [sys.executable, "-m", "pip", "install"]
          subprocess.run([*pip, "-e", f".[{extras}]"], check=True)
          subprocess.run([*pip, "--no-deps", "-e", "./.sci-etl-cli"], check=True)
          subprocess.run([*pip, *others], check=True)

      - name: Confirm the CLI imports this checkout of sci-etl-core
        shell: python
        run: |
          from pathlib import Path

          import sci_etl_core

          location = Path(sci_etl_core.__file__).resolve()
          workspace = Path.cwd().resolve()
          print(f"sci_etl_core imported from {location}")
          if workspace not in location.parents:
              raise SystemExit(f"expected sci_etl_core from {workspace}")

      - name: Record resolved dependency versions
        run: python -m pip freeze

      - name: Run the CLI suite, failing on any DeprecationWarning
        working-directory: .sci-etl-cli
        run: python -m pytest -W error::DeprecationWarning

  catalogue:
    name: udg-catalogue against this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out udg-catalogue
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.CATALOGUE_REPOSITORY }}
          path: .udg-catalogue

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .udg-catalogue/requirements.txt
            .udg-catalogue/requirements/*.txt

      - name: Install this commit with the catalogue's extras, plus its pinned requirements
        shell: python
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          lines = Path(".udg-catalogue/requirements.txt").read_text(encoding="utf-8").splitlines()
          core = next(line.strip() for line in lines if line.strip().startswith("sci-etl-core"))
          extras = re.fullmatch(r"sci-etl-core\[([^\]]*)\].*", core).group(1).replace(" ", "")
          subprocess.run(
              [
                  sys.executable, "-m", "pip", "install",
                  "-e", f".[{extras}]",
                  "-r", ".udg-catalogue/requirements/app.txt",
                  "-r", ".udg-catalogue/requirements/dev.txt",
              ],
              check=True,
          )

      - name: Confirm the catalogue imports this checkout of sci-etl-core
        shell: python
        run: |
          from pathlib import Path

          import sci_etl_core

          location = Path(sci_etl_core.__file__).resolve()
          workspace = Path.cwd().resolve()
          print(f"sci_etl_core imported from {location}")
          if workspace not in location.parents:
              raise SystemExit(f"expected sci_etl_core from {workspace}")

      - name: Record resolved dependency versions
        run: python -m pip freeze

      - name: Run the catalogue suite, failing on any DeprecationWarning
        working-directory: .udg-catalogue
        run: python -m pytest -W error::DeprecationWarning
