[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-etl-core"
version = "0.1.0"
description = "Reusable, domain-agnostic ETL core for scientific text mining."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "beautifulsoup4",
    "lxml",
    "pandas",
]

[project.optional-dependencies]
async = ["httpx", "aiofiles", "aiolimiter"]
llm = ["openai", "tiktoken"]
sql = ["sqlalchemy>=2"]
viz = ["plotly"]
full = [
    "httpx", "aiofiles", "aiolimiter",
    "openai", "tiktoken",
    "sqlalchemy>=2",
    "plotly",
    "pdfplumber", "scikit-learn", "numpy", "requests",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]