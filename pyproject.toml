[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-etl-core"
version = "0.1.0"
description = "Domain-agnostic ETL toolkit for scientific text mining pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lan" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0",
    "openai>=1.0.0",
    "beautifulsoup4>=4.11.0",
    "pdfplumber>=0.9.0",
    "plotly>=5.0.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "pytest-asyncio>=0.23", "pytest-cov"]
sql = ["sqlalchemy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
