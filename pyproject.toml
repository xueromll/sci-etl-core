[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-etl-core"
version = "0.1.0"
description = "Reusable, domain-agnostic core for scientific text-mining ETL pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "urllib3",
    "beautifulsoup4",
    "lxml",
    "pypdf",
    "pdfplumber",
    "pyyaml",
    "python-dotenv",
    "pydantic>=2",
    "httpx",
    "aiofiles",
    "openai",
]

[project.optional-dependencies]
async = ["httpx", "tenacity"]
sql = ["sqlalchemy"]
viz = ["plotly", "matplotlib", "seaborn"]
llm = ["openai", "anthropic"]

[tool.setuptools.packages.find]
where = ["src"]
