[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-etl-core"
version = "0.1.2"
description = "Reusable, domain-agnostic ETL core for scientific text mining."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["etl", "pipeline", "text-mining", "scientific-literature", "data-extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "beautifulsoup4",
    "lxml",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/xueromll/sci-etl-core"
Repository = "https://github.com/xueromll/sci-etl-core"
Issues = "https://github.com/xueromll/sci-etl-core/issues"

[project.optional-dependencies]
async = ["httpx", "aiofiles", "aiolimiter"]
llm = ["openai", "tiktoken"]
pdf = ["pdfplumber"]
sql = ["sqlalchemy>=2", "aiosqlite"]
viz = ["plotly", "aiofiles"]
cluster = ["scikit-learn", "numpy"]
embeddings = ["numpy", "openai"]
embeddings-local = ["numpy", "sentence-transformers"]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "pytest-cov", "hypothesis"]
full = [
    "httpx", "aiofiles", "aiolimiter",
    "openai", "tiktoken",
    "pdfplumber",
    "sqlalchemy>=2", "aiosqlite",
    "plotly",
    "scikit-learn", "numpy",
    "requests",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sci_etl_core = ["py.typed"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
