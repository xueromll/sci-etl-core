site_name: sci-etl-core
site_description: A Python library for turning scientific papers from any field into structured, searchable data, and the sci-etl CLI that runs it from YAML.
site_url: https://xueromll.github.io/sci-etl-core/
repo_url: https://github.com/xueromll/sci-etl-core
repo_name: xueromll/sci-etl-core
edit_uri: ""
copyright: Released under the MIT License.

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  /hooks.py
  __pycache__/

hooks:
  - docs/hooks.py

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xueromll/sci-etl-core
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sci-etl-core/

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Библиотека Python для превращения научных статей из любой области науки в структурированные данные с поиском, и CLI sci-etl, который запускает её из YAML.
          nav_translations:
            Home: Главная
            Getting started: Начало работы
            Installation: Установка
            Quick start: Быстрый старт
            Blocking usage: Блокирующий режим
